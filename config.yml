          title: Vedang Lad
          subtitle: |
            <div style="text-align: left; font-size: 1.1em; line-height: 1.7em; margin-top: 20px;">
              I'm a PhD student at Stanford University, fortunate to be working with <a href="https://ganguli-gang.stanford.edu/surya.html" target="_blank" rel="noopener">Surya Ganguli</a> and <a href="https://web.stanford.edu/~cgpotts/" target="_blank" rel="noopener">Christopher Potts</a>.  I'm particularly interested in uncovering the mechanisms and structures that give rise to intelligence and using that understanding to build smarter and safer AI systems.<br><br>

              I received my MEng in EECS from MIT, where I worked on mechanistic interpretability with <a href="https://tegmark.org/" target="_blank" rel="noopener">Max Tegmark</a>. Before that, I studied computer science and physics at MIT, where I worked on data-centric methods in ML. Outside of research, I competed in NCAA cross country and track and field at MIT. I currently run competitively for <a href="https://www.peninsuladistanceclub.com/" target="_blank" rel="noopener">Peninsula Distance Club</a>.
            </div>

          imageUrl: "/picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          imageTitle: Vedang Lad
