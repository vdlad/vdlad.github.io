          subtitle: |
            <div style="text-align: left; font-size: 1.1em; line-height: 1.7em; margin-top: 20px;">
             I'm an AI researcher — a blend of engineer and scientist. My interests span computer science, neuroscience, and math, with a particular focus on the mechanisms and structures that facilitate intelligence, and how we can leverage that understanding to build smarter, safer systems.<br><br>
             Currently, I'm a Founding ML Researcher at <a href="https://www.metamorphic.com/" target="_blank">Metamorphic</a>, a startup in Palo Alto that spun out of Stanford, where I help build multimodal world models. Before that, I was a MATS scholar and studied computer science and physics at MIT. There, I worked on interpretability with <a href="https://tegmark.org/" target="_blank">Max Tegmark</a> and spent time on data-centric methods in ML. I'll be starting a PhD at Stanford in Fall 2026.<br><br>
             Outside of research, I was an NCAA track and field athlete at MIT and still run competitively for <a href="https://www.peninsuladistanceclub.com/" target="_blank">Peninsula Distance Club</a> in the Bay Area.
            </div>


